<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="City lights at night">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#060718"/>
      <stop offset="45%" stop-color="#171041"/>
      <stop offset="72%" stop-color="#3a1a63"/>
      <stop offset="100%" stop-color="#0a0714"/>
    </linearGradient>
    <radialGradient id="moon" cx="38%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#d9d2ff"/>
      <stop offset="100%" stop-color="#9d8cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d1838"/>
      <stop offset="100%" stop-color="#0b0818"/>
